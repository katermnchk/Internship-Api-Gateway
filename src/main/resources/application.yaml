server:
  port: 8080

spring:
  application:
    name: InnowiseApiGateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true

      routes:
        - id: registration-route
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/register
            - Method=POST

        - id: auth-service-routes
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=2

        - id: user-service-routes
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=2

        - id: order-service-routes
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**, /api/v1/items/**
          filters:
            - StripPrefix=2

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true