server:
  port: 8080

spring:
  application:
    name: InnowiseApiGateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true

      routes:
        - id: auth-service-route
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service-route
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**

        - id: order-service-route
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**, /api/v1/items/**

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true