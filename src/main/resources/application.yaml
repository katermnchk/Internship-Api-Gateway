server:
  port: 8099

spring:
  application:
    name: InnowiseApiGateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

      routes:
        - id: auth-service-route
          uri: http://auth-service:8080
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service-base-route
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/users
            - Method=GET

        - id: user-service-specific-routes
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/users/{segment}/**
            - Method=GET,PATCH,DELETE

        - id: order-service-route
          uri: http://order-service:8082
          predicates:
            - Path=/api/v1/orders/**, /api/v1/items/**

        - id: payment-service-route
          uri: http://payment-service:8083
          predicates:
            - Path=/api/v1/payments/**

        - id: random-org-route
          uri: https://www.random.org
          predicates:
            - Path=/api/v1/random/**
          filters:
            - StripPrefix=3
